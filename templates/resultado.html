<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado del Análisis</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #333; margin-bottom: 5px; }
        .usuario { color: #666; margin-bottom: 20px; font-size: 1.1em; }
        
        /* Cajas de estado */
        .status-box {
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            font-weight: bold;
            display: none; /* Ocultos por defecto */
        }
        
        /* Estilo BOT */
        .bot-box {
            background-color: #ffe6e6;
            border: 1px solid #ffcccc;
            color: #cc0000;
        }
        
        /* Estilo HUMANO */
        .human-box {
            background-color: #e6fffa;
            border: 1px solid #ccffe6;
            color: #006633;
        }

        .probabilidad { font-size: 0.9em; color: #888; margin-top: 10px; }
        
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Análisis Finalizados</h1>
        
        <p class="usuario">Usuario: <span id="nombre-usuario">Cargando...</span></p>

        <div id="caja-bot" class="status-box bot-box">
            🤖 DETECTADO: BOT
            <p style="font-weight: normal; font-size: 0.9em; margin-top: 5px;">
                El sistema ha detectado comportamientos automatizados.
            </p>
        </div>

        <div id="caja-humano" class="status-box human-box">
            👤 VERIFICADO: HUMANO
            <p style="font-weight: normal; font-size: 0.9em; margin-top: 5px;">
                Patrones de movimiento naturales confirmados.
            </p>
        </div>

        <p class="probabilidad">Probabilidad de ser Bot: <span id="val-prob">0</span>%</p>

        <a href="https://www.niandur.com/TFM/Captcha_1.html" class="btn">Volver a Probar</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. LEER LOS DATOS DE LA URL
            // Captcha_1.html envía algo como: ?nombre=Juan&is_human=true&prob=12.5
            const params = new URLSearchParams(window.location.search);
            
            const nombre = params.get('nombre') || "Anónimo";
            const prob = params.get('prob') || "0";
            
            // Ojo: los params vienen siempre como texto ("true" o "false")
            const isHuman = params.get('is_human') === 'true'; 

            // 2. RELLENAR LOS TEXTOS
            document.getElementById('nombre-usuario').textContent = nombre;
            document.getElementById('val-prob').textContent = prob;

            // 3. MOSTRAR LA CAJA CORRECTA
            if (isHuman) {
                // Es humano -> Mostramos caja verde, ocultamos roja
                document.getElementById('caja-humano').style.display = 'block';
                document.getElementById('caja-bot').style.display = 'none';
            } else {
                // Es bot -> Mostramos caja roja, ocultamos verde
                document.getElementById('caja-bot').style.display = 'block';
                document.getElementById('caja-humano').style.display = 'none';
            }
        });
    </script>
</body>
</html>
